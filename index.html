<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Manajemen Farmasi Klinik - Apotek Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_ITEMS = [
            { id: 'OBT-001', name: 'Amlodipine 5 mg', category: 'Oral', initialStock: 100, unit: 'Tablet', minStock: 30, price: 500, isLasa: true, isHighAlert: false, expDate: '2027-02-15', batchNo: 'BATCH-AML5-01' },
            { id: 'OBT-002', name: 'Amlodipine 10 mg', category: 'Oral', initialStock: 10, unit: 'Tablet', minStock: 25, price: 800, isLasa: true, isHighAlert: false, expDate: '2027-01-10', batchNo: 'BATCH-AML10-02' },
            { id: 'OBT-003', name: 'Paracetamol 500 mg', category: 'Oral', initialStock: 500, unit: 'Kaplet', minStock: 50, price: 300, isLasa: false, isHighAlert: false, expDate: '2028-06-20', batchNo: 'BATCH-PCT-09' },
            { id: 'OBT-004', name: 'Dexamethasone Inj 5mg/ml', category: 'Injeksi', initialStock: 50, unit: 'Ampul', minStock: 15, price: 4500, isLasa: true, isHighAlert: true, expDate: '2027-03-30', batchNo: 'BATCH-DEX-88' },
            { id: 'OBT-005', name: 'Diazepam Inj 5mg/ml', category: 'Injeksi', initialStock: 15, unit: 'Ampul', minStock: 10, price: 7500, isLasa: true, isHighAlert: true, expDate: '2027-04-12', batchNo: 'BATCH-DZP-11' },
            { id: 'OBT-006', name: 'Epinefrin (Adrenalin) Inj', category: 'Injeksi', initialStock: 7, unit: 'Ampul', minStock: 10, price: 12000, isLasa: true, isHighAlert: true, expDate: '2026-12-01', batchNo: 'BATCH-EPN-03' },
            { id: 'OBT-007', name: 'Vaksin Hepatitis B (Cold Chain)', category: 'Cold-Chain', initialStock: 20, unit: 'Vial', minStock: 5, price: 45000, isLasa: false, isHighAlert: true, expDate: '2027-08-14', batchNo: 'BATCH-VAK-99' },
            { id: 'BMHP-001', name: 'Spuit 3cc Terumo', category: 'BMHP', initialStock: 350, unit: 'Pcs', minStock: 50, price: 1500, isLasa: false, isHighAlert: false, expDate: '2029-01-01', batchNo: 'BATCH-SPT-44' }
        ];

        const INITIAL_TRANSACTIONS = [
            { id: 'TRX-1001', date: '2026-11-01', itemId: 'OBT-001', itemName: 'Amlodipine 5 mg', type: 'IN', qty: 100, docNo: 'DO/DISKES/2026/11', notes: 'Droping Diskes' },
            { id: 'TRX-1002', date: '2026-11-02', itemId: 'OBT-001', itemName: 'Amlodipine 5 mg', type: 'OUT', qty: 80, docNo: 'RSP/2026/001', notes: 'Pasien: Ny. Suminah' },
            { id: 'TRX-1003', date: '2026-11-05', itemId: 'OBT-006', itemName: 'Epinefrin (Adrenalin) Inj', type: 'OUT', qty: 2, docNo: 'RSP/2026/005', notes: 'Pasien Emergency IGD' },
            { id: 'TRX-1004', date: '2026-11-06', itemId: 'OBT-003', itemName: 'Paracetamol 500 mg', type: 'OUT', qty: 50, docNo: 'RSP/2026/006', notes: 'Pasien Umum' }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('sim_farmasi_items');
                return saved ? JSON.parse(saved) : INITIAL_ITEMS;
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('sim_farmasi_trxs');
                return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
            });

            const [alertMessage, setAlertMessage] = useState('');
            const [alertType, setAlertType] = useState('success');

            const [productSearch, setProductSearch] = useState('');
            const [productCategoryFilter, setProductCategoryFilter] = useState('ALL');

            const [outStartDate, setOutStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [outEndDate, setOutEndDate] = useState(new Date().toISOString().split('T')[0]);

            const [selectedAdjustmentItem, setSelectedAdjustmentItem] = useState(null);
            const [adjustmentPhysicalQty, setAdjustmentPhysicalQty] = useState('');
            const [adjustmentReason, setAdjustmentReason] = useState('');
            const [adjustmentNotes, setAdjustmentNotes] = useState('');

            const [stockOpnameData, setStockOpnameData] = useState({});

            useEffect(() => {
                localStorage.setItem('sim_farmasi_items', JSON.stringify(items));
            }, [items]);

            useEffect(() => {
                localStorage.setItem('sim_farmasi_trxs', JSON.stringify(transactions));
            }, [transactions]);

            const showAlert = (msg, type = 'success') => {
                setAlertMessage(msg);
                setAlertType(type);
                setTimeout(() => setAlertMessage(''), 4000);
            };

            const calculateCurrentStock = (itemId) => {
                const targetItem = items.find(i => i.id === itemId);
                if (!targetItem) return 0;
                let stock = Number(targetItem.initialStock) || 0;

                transactions.forEach(t => {
                    if (t.itemId === itemId) {
                        const qty = Number(t.qty) || 0;
                        if (t.type === 'IN') {
                            stock += qty;
                        } else if (t.type === 'OUT') {
                            stock -= qty;
                        } else if (t.type === 'ADJUSTMENT') {
                            stock += qty;
                        }
                    }
                });
                return stock < 0 ? 0 : stock;
            };

            const getSynchronizedItems = () => {
                return items.map(item => ({
                    ...item,
                    stock: calculateCurrentStock(item.id)
                }));
            };

            const syncedItems = getSynchronizedItems();

            const getNearExpiredItems = () => {
                const today = new Date();
                const sixMonthsFromNow = new Date();
                sixMonthsFromNow.setDate(today.getDate() + 180);

                return syncedItems.filter(item => {
                    const exp = new Date(item.expDate);
                    return exp <= sixMonthsFromNow;
                }).map(item => {
                    const exp = new Date(item.expDate);
                    const diffTime = exp - today;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    return { ...item, diffDays };
                });
            };

            const nearExpiredItems = getNearExpiredItems();

            const handleExportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ items, transactions }, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `Backup_Farmasi_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showAlert('Data cadangan berhasil diunduh!');
            };

            const handleImportBackup = (e) => {
                const fileReader = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed.items && parsed.transactions) {
                                setItems(parsed.items);
                                setTransactions(parsed.transactions);
                                showAlert('Data berhasil dipulihkan!');
                            } else {
                                showAlert('Format file JSON tidak valid.', 'error');
                            }
                        } catch (err) {
                            showAlert('Gagal membaca file JSON backup.', 'error');
                        }
                    };
                }
            };

            const handleImportProductsCSV = (e) => {
                const fileReader = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const textData = event.target.result;
                            const lines = textData.split(/\r\n|\n/).filter(l => l.trim() !== '');
                            if (lines.length < 2) {
                                showAlert('File CSV kosong atau format tidak valid.', 'error');
                                return;
                            }
                            
                            const headerCols = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
                            
                            const getColIdx = (names) => {
                                for (let name of names) {
                                    const idx = headerCols.findIndex(h => h.includes(name));
                                    if (idx >= 0) return idx;
                                }
                                return -1;
                            };

                            const idxId = getColIdx(['kode', 'id']);
                            const idxName = getColIdx(['nama produk', 'nama', 'name']);
                            const idxCat = getColIdx(['kategori', 'category']);
                            const idxStock = getColIdx(['stok', 'stock']);
                            const idxUnit = getColIdx(['satuan', 'unit']);
                            const idxBatch = getColIdx(['batch', 'no batch']);
                            const idxExp = getColIdx(['exp', 'expired', 'date']);
                            const idxPrice = getColIdx(['harga', 'price']);
                            const idxMin = getColIdx(['min', 'minimum']);

                            let newItems = [...items];
                            let importedCount = 0;

                            for (let i = 1; i < lines.length; i++) {
                                const line = lines[i].trim();
                                if (!line) continue;
                                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.replace(/^"|"$/g, '').trim());
                                
                                const id = idxId >= 0 ? cols[idxId] : ('OBT-' + Date.now() + '-' + i);
                                const name = idxName >= 0 ? cols[idxName] : 'Produk Baru';
                                const category = idxCat >= 0 ? cols[idxCat] : 'Oral';
                                const stockVal = idxStock >= 0 ? Number(cols[idxStock]) : 0;
                                const unit = idxUnit >= 0 ? cols[idxUnit] : 'Tablet';
                                const batchNo = idxBatch >= 0 ? cols[idxBatch] : 'BATCH-NEW';
                                const expDate = idxExp >= 0 ? cols[idxExp] : '2027-12-31';
                                const price = idxPrice >= 0 ? Number(cols[idxPrice]) : 1000;
                                const minStock = idxMin >= 0 ? Number(cols[idxMin]) : 10;

                                if (id && name) {
                                    const existingIdx = newItems.findIndex(item => item.id === id);
                                    const itemObj = {
                                        id,
                                        name,
                                        category,
                                        initialStock: stockVal,
                                        unit,
                                        minStock,
                                        price,
                                        isLasa: false,
                                        isHighAlert: false,
                                        expDate,
                                        batchNo
                                    };
                                    if (existingIdx >= 0) {
                                        newItems[existingIdx] = { ...newItems[existingIdx], ...itemObj };
                                    } else {
                                        newItems.push(itemObj);
                                    }
                                    importedCount++;
                                }
                            }
                            setItems(newItems);
                            showAlert(`Berhasil mengimpor ${importedCount} produk! Daftar produk telah diperbarui.`);
                        } catch (err) {
                            showAlert('Gagal memproses file CSV.', 'error');
                        }
                    };
                }
            };

            const [outForm, setOutForm] = useState({
                patientName: '',
                rxNo: '',
                rxDate: new Date().toISOString().split('T')[0],
                items: [{ itemId: '', qty: '' }]
            });

            const [invoiceHeader, setInvoiceHeader] = useState({
                supplier: 'Diskes Kodaeral XIV',
                spNo: '',
                invoiceNo: '',
                invoiceDate: new Date().toISOString().split('T')[0],
                receiveDate: new Date().toISOString().slice(0, 16).replace('T', ' '),
                discountPercent: 0,
                cashback: 0,
                otherCosts: 0,
                notes: ''
            });

            const [invoiceItems, setInvoiceItems] = useState([
                { itemId: '', expDate: '', batchNo: '', qty: 1, unit: 'Box', buyPrice: 0, discount: 0, tax: 0 }
            ]);

            const handleAddInvoiceItem = () => {
                setInvoiceItems([...invoiceItems, { itemId: '', expDate: '', batchNo: '', qty: 1, unit: 'Box', buyPrice: 0, discount: 0, tax: 0 }]);
            };

            const handleRemoveInvoiceItem = (index) => {
                if (invoiceItems.length === 1) return;
                setInvoiceItems(invoiceItems.filter((_, i) => i !== index));
            };

            const handleInvoiceItemChange = (index, field, value) => {
                const updated = [...invoiceItems];
                updated[index][field] = value;
                if (field === 'itemId') {
                    const sel = syncedItems.find(i => i.id === value);
                    if (sel) {
                        updated[index].unit = sel.unit;
                        updated[index].buyPrice = sel.price;
                        updated[index].expDate = sel.expDate;
                        updated[index].batchNo = sel.batchNo;
                    }
                }
                setInvoiceItems(updated);
            };

            const calculateSubTotal = () => {
                return invoiceItems.reduce((sum, item) => {
                    const lineTotal = (Number(item.qty) || 0) * (Number(item.buyPrice) || 0) - (Number(item.discount) || 0);
                    return sum + lineTotal;
                }, 0);
            };

            const calculateGrandTotal = () => {
                const sub = calculateSubTotal();
                const discountVal = (sub * (Number(invoiceHeader.discountPercent) || 0)) / 100;
                const net = sub - discountVal - (Number(invoiceHeader.cashback) || 0) + (Number(invoiceHeader.otherCosts) || 0);
                return net > 0 ? net : 0;
            };

            const handleSaveInvoice = (e) => {
                e.preventDefault();
                if (!invoiceHeader.invoiceNo) {
                    showAlert('Mohon isi Nomor Faktur!', 'error');
                    return;
                }
                const validItems = invoiceItems.filter(i => i.itemId && Number(i.qty) > 0);
                if (validItems.length === 0) {
                    showAlert('Mohon lengkapi minimal 1 item produk!', 'error');
                    return;
                }

                let newTrxs = [];
                validItems.forEach(itemRow => {
                    const qtyVal = parseInt(itemRow.qty, 10);
                    const target = syncedItems.find(i => i.id === itemRow.itemId);
                    newTrxs.push({
                        id: 'TRX-' + Date.now().toString().slice(-5) + '-' + Math.floor(Math.random()*10),
                        date: invoiceHeader.invoiceDate,
                        itemId: itemRow.itemId,
                        itemName: target ? target.name : '',
                        type: 'IN',
                        qty: qtyVal,
                        docNo: invoiceHeader.invoiceNo,
                        notes: `Faktur PBF: ${invoiceHeader.supplier}`
                    });
                });

                setTransactions([...newTrxs, ...transactions]);
                showAlert(`Faktur ${invoiceHeader.invoiceNo} berhasil disimpan! Stok otomatis bertambah.`);
                setInvoiceHeader({ ...invoiceHeader, invoiceNo: '', spNo: '', notes: '' });
                setInvoiceItems([{ itemId: '', expDate: '', batchNo: '', qty: 1, unit: 'Box', buyPrice: 0, discount: 0, tax: 0 }]);
            };

            const handleOutSubmit = (e) => {
                e.preventDefault();
                if (!outForm.rxNo || !outForm.patientName) {
                    showAlert('Mohon isi Nomor Resep dan Nama Pasien!', 'error');
                    return;
                }
                const validRows = outForm.items.filter(i => i.itemId && Number(i.qty) > 0);
                if (validRows.length === 0) {
                    showAlert('Pilih minimal 1 obat dengan kuantitas valid!', 'error');
                    return;
                }

                let insufficient = false;
                validRows.forEach(row => {
                    const target = syncedItems.find(i => i.id === row.itemId);
                    if (target && target.stock < parseInt(row.qty, 10)) {
                        insufficient = true;
                        showAlert(`Stok obat ${target.name} tidak mencukupi (sisa ${target.stock})`, 'error');
                    }
                });

                if (insufficient) return;

                let newTrxs = [];
                validRows.forEach(row => {
                    const qtyVal = parseInt(row.qty, 10);
                    const target = syncedItems.find(i => i.id === row.itemId);
                    newTrxs.push({
                        id: 'TRX-' + Date.now().toString().slice(-5) + '-' + Math.floor(Math.random()*10),
                        date: outForm.rxDate || new Date().toISOString().split('T')[0],
                        itemId: row.itemId,
                        itemName: target ? target.name : '',
                        type: 'OUT',
                        qty: qtyVal,
                        docNo: outForm.rxNo,
                        notes: `Pasien: ${outForm.patientName}`
                    });
                });

                setTransactions([...newTrxs, ...transactions]);
                setOutForm({ patientName: '', rxNo: '', rxDate: new Date().toISOString().split('T')[0], items: [{ itemId: '', qty: '' }] });
                showAlert(`Resep ${outForm.rxNo} berhasil diproses!`);
            };

            const [stockCardItemId, setStockCardItemId] = useState(syncedItems[0]?.id || '');
            const selectedStockCardItem = syncedItems.find(i => i.id === stockCardItemId) || syncedItems[0];

            const getStockCardTransactions = () => {
                if (!stockCardItemId) return [];
                const itemTrxs = transactions.filter(t => t.itemId === stockCardItemId);
                itemTrxs.sort((a, b) => new Date(a.date) - new Date(b.date));

                const targetItem = items.find(i => i.id === stockCardItemId);
                let runningStock = targetItem ? (Number(targetItem.initialStock) || 0) : 0;

                return itemTrxs.map(t => {
                    if (t.type === 'IN') {
                        runningStock += t.qty;
                    } else if (t.type === 'OUT') {
                        runningStock -= t.qty;
                    } else if (t.type === 'ADJUSTMENT') {
                        runningStock += t.qty;
                    }
                    return { ...t, balance: runningStock };
                });
            };

            const getPurchasePlanData = () => {
                const itemUsage = {};
                syncedItems.forEach(i => {
                    itemUsage[i.id] = { ...i, totalOut: 0, consumptionRate: 0 };
                });

                transactions.forEach(t => {
                    if (t.type === 'OUT' && itemUsage[t.itemId]) {
                        itemUsage[t.itemId].totalOut += t.qty;
                    }
                });

                const list = Object.values(itemUsage).map(item => {
                    const consumptionRate = Number((item.totalOut / 30).toFixed(2));
                    const leadTime = 14;
                    const bufferStock = 6;
                    const safetyStock = Math.ceil(consumptionRate * bufferStock);
                    const rop = Math.ceil((consumptionRate * leadTime) + safetyStock);
                    const targetStock = Math.ceil(consumptionRate * 90) + safetyStock;
                    const suggestedOrder = targetStock > item.stock ? targetStock - item.stock : 0;

                    return {
                        ...item,
                        consumptionRate,
                        safetyStock,
                        rop,
                        suggestedOrder: suggestedOrder > 0 ? suggestedOrder : 0
                    };
                });

                list.sort((a, b) => b.totalOut - a.totalOut);

                const totalUsageAll = list.reduce((sum, i) => sum + i.totalOut, 0) || 1;
                let cumulative = 0;

                return list.map((item, idx) => {
                    cumulative += item.totalOut;
                    const percentage = (cumulative / totalUsageAll) * 100;
                    
                    let abcClass = 'C';
                    if (percentage <= 80) abcClass = 'A';
                    else if (percentage <= 95) abcClass = 'B';

                    return { ...item, abcClass, rank: idx + 1 };
                });
            };

            const purchasePlanList = getPurchasePlanData();

            const filteredProducts = syncedItems.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(productSearch.toLowerCase()) || item.id.toLowerCase().includes(productSearch.toLowerCase());
                const matchesCategory = productCategoryFilter === 'ALL' || item.category === productCategoryFilter;
                return matchesSearch && matchesCategory;
            });

            const handleExportProductsExcel = () => {
                let csvContent = "data:text/csv;charset=utf-8,Kode,Nama Produk,Kategori,Stok,Satuan,No Batch,Exp Date,Harga,MinStok\r\n";
                filteredProducts.forEach(row => {
                    csvContent += `"${row.id}","${row.name}","${row.category}",${row.stock},"${row.unit}","${row.batchNo}","${row.expDate}",${row.price},${row.minStock}\r\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Template_Daftar_Produk_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
                showAlert("Template Daftar Produk berhasil diunduh!");
            };

            const handleExportPurchasePlanExcel = () => {
                let csvContent = "data:text/csv;charset=utf-8,Rank,Kode,Nama Produk,Kelas Pareto,Total Keluar (90h),Konsumsi/Hari,Safety Stock,ROP,Stok Saat Ini,Rekomendasi Beli,Satuan\r\n";
                purchasePlanList.forEach(row => {
                    csvContent += `${row.rank},"${row.id}","${row.name}","${row.abcClass}",${row.totalOut},${row.consumptionRate},${row.safetyStock},${row.rop},${row.stock},${row.suggestedOrder},"${row.unit}"\r\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Rencana_Pembelian_ParetoABC_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
                showAlert("Rencana Pembelian berhasil diunduh!");
            };

            const getDailyOutgoingData = () => {
                const filteredTrxs = transactions.filter(t => {
                    return t.type === 'OUT' && t.date >= outStartDate && t.date <= outEndDate;
                });

                const aggregated = {};
                filteredTrxs.forEach(t => {
                    if (!aggregated[t.itemId]) {
                        const targetItem = syncedItems.find(i => i.id === t.itemId);
                        aggregated[t.itemId] = {
                            id: t.itemId,
                            name: t.itemName || (targetItem ? targetItem.name : 'Unknown'),
                            totalOut: 0,
                            unit: targetItem ? targetItem.unit : 'Unit'
                        };
                    }
                    aggregated[t.itemId].totalOut += t.qty;
                });

                return {
                    list: Object.values(aggregated),
                    totalRxCount: new Set(filteredTrxs.map(t => t.docNo)).size,
                    totalQtyOut: filteredTrxs.reduce((sum, t) => sum + t.qty, 0)
                };
            };

            const dailyOutgoing = getDailyOutgoingData();

            const handleExportDailyOutgoingExcel = () => {
                let csvContent = "data:text/csv;charset=utf-8,Kode,Nama Produk,Total Keluar,Satuan\r\n";
                dailyOutgoing.list.forEach(row => {
                    csvContent += `"${row.id}","${row.name}",${row.totalOut},"${row.unit}"\r\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Daftar_Barang_Keluar_${outStartDate}_hingga_${outEndDate}.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
                showAlert("Daftar Barang Keluar berhasil diunduh!");
            };

            const handleSaveStockOpname = () => {
                let newTrxs = [...transactions];
                let count = 0;

                Object.keys(stockOpnameData).forEach(itemId => {
                    const opnameObj = stockOpnameData[itemId];
                    if (opnameObj && opnameObj.physical !== '') {
                        const physicalVal = parseInt(opnameObj.physical, 10);
                        const targetItem = syncedItems.find(i => i.id === itemId);
                        if (targetItem && !isNaN(physicalVal)) {
                            const diff = physicalVal - targetItem.stock;
                            if (diff !== 0) {
                                count++;
                                newTrxs.unshift({
                                    id: 'TRX-ADJ-' + Date.now() + '-' + Math.floor(Math.random()*10),
                                    date: new Date().toISOString().split('T')[0],
                                    itemId: itemId,
                                    itemName: targetItem.name,
                                    type: 'ADJUSTMENT',
                                    qty: diff,
                                    docNo: 'OPNAME/' + new Date().toISOString().slice(0,7),
                                    notes: opnameObj.notes || 'Stok Opname Rutin'
                                });
                            }
                        }
                    }
                });

                setTransactions(newTrxs);
                showAlert(`Stok Opname berhasil disimpan! ${count} item disesuaikan dengan mutasi.`);
            };

            const handleSaveSingleAdjustment = () => {
                if (!selectedAdjustmentItem) return;
                const physicalVal = parseInt(adjustmentPhysicalQty, 10);
                if (isNaN(physicalVal)) {
                    showAlert('Mohon masukkan jumlah stok fisik yang valid!', 'error');
                    return;
                }

                const diff = physicalVal - selectedAdjustmentItem.stock;
                let newTrxs = [
                    {
                        id: 'TRX-ADJ-' + Date.now(),
                        date: new Date().toISOString().split('T')[0],
                        itemId: selectedAdjustmentItem.id,
                        itemName: selectedAdjustmentItem.name,
                        type: 'ADJUSTMENT',
                        qty: diff,
                        docNo: 'ADJ/' + new Date().toISOString().slice(0,7),
                        notes: `Penyesuaian Stok (${adjustmentReason || 'Selisih'}): ${adjustmentNotes}`
                    },
                    ...transactions
                ];

                setTransactions(newTrxs);
                showAlert(`Penyesuaian stok ${selectedAdjustmentItem.name} berhasil dicatat!`);
                setSelectedAdjustmentItem(null);
                setAdjustmentPhysicalQty('');
                setAdjustmentReason('');
                setAdjustmentNotes('');
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 font-sans text-slate-800">
                    <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg">
                                    <i className="fa-solid fa-house-medical text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide flex items-center gap-2">
                                        SIM-FARMASI KLINIK
                                        <span className="text-[10px] bg-blue-800 text-blue-200 px-2 py-0.5 rounded-full uppercase">Digital Apothecary</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">Klinik Pratama Kodaeral XIV • Presisi, FEFO & Akreditasi PMK 34/2021</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button onClick={handleExportBackup} className="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5 shadow-sm">
                                    <i className="fa-solid fa-cloud-arrow-down text-blue-400"></i> Backup JSON
                                </button>
                                <label className="bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5 cursor-pointer shadow-sm">
                                    <i className="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Restore
                                    <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                                </label>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col lg:flex-row gap-6">
                        <aside className="w-full lg:w-64 flex-shrink-0 space-y-1 bg-white p-3 rounded-xl border border-slate-200 shadow-sm self-start">
                            <div className="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Menu Utama</div>
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-chart-pie w-4 text-center"></i> Dashboard Umum</span>
                            </button>
                            <button onClick={() => setActiveTab('prescription')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'prescription' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-file-prescription w-4 text-center"></i> Penebusan Resep</span>
                            </button>
                            <button onClick={() => setActiveTab('daily_outgoing')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'daily_outgoing' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-boxes-stacked w-4 text-center"></i> Daftar Barang Keluar</span>
                            </button>
                            <button onClick={() => setActiveTab('products')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'products' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-pills w-4 text-center"></i> Daftar Produk</span>
                            </button>
                            <button onClick={() => setActiveTab('stockcard')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'stockcard' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-id-card-clip w-4 text-center"></i> Kartu Stok</span>
                            </button>

                            <div className="px-3 pt-4 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Pengadaan & Pembelian</div>
                            <button onClick={() => setActiveTab('purchase_plan')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'purchase_plan' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-clipboard-list w-4 text-center"></i> Rencana Pembelian</span>
                            </button>
                            <button onClick={() => setActiveTab('incoming')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'incoming' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-file-invoice-dollar w-4 text-center"></i> Faktur Pembelian</span>
                            </button>
                            <button onClick={() => setActiveTab('returns')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'returns' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-rotate-left w-4 text-center"></i> Retur Pembelian</span>
                            </button>

                            <div className="px-3 pt-4 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">Stok & Audit</div>
                            <button onClick={() => setActiveTab('stock_opname')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'stock_opname' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-boxes-packing w-4 text-center"></i> Stok Opname</span>
                            </button>
                            <button onClick={() => setActiveTab('adjustment')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-between transition ${activeTab === 'adjustment' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <span className="flex items-center gap-2.5"><i className="fa-solid fa-sliders w-4 text-center"></i> Penyesuaian Stok</span>
                            </button>
                        </aside>

                                <div className={`p-4 rounded-xl border flex items-center justify-between shadow-sm transition ${alertType === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`}>
                                    <div className="flex items-center gap-2.5">
                                        <i className={`fa-solid ${alertType === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                                        <span className="text-sm font-medium">{alertMessage}</span>
                                    </div>
                                    <button onClick={() => setAlertMessage('')} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                            )}

                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

                                            <div className="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-boxes-stacked"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">Total Jenis Produk</div>
                                                <div className="text-xl font-bold text-slate-800">{syncedItems.length} Sediaan</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-cubes"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">Total Stok Fisik</div>
                                                <div className="text-xl font-bold text-slate-800">{syncedItems.reduce((acc, item) => acc + item.stock, 0)} Unit</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-triangle-exclamation"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">Peringatan FEFO (&lt; 6 Bln)</div>
                                                <div className="text-xl font-bold text-amber-600">{nearExpiredItems.length} Obat</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-notes-medical"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">Stok Kritis / Menipis</div>
                                                <div className="text-xl font-bold text-rose-600">{syncedItems.filter(i => i.stock <= i.minStock).length} Item</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                        <h3 className="font-bold text-slate-800 text-base mb-3 flex items-center gap-2">
                                            <i className="fa-solid fa-hourglass-half text-amber-500"></i> Peringatan Kadaluwarsa Obat (&lt; 6 Bulan)
                                        </h3>
                                        {nearExpiredItems.length === 0 ? (
                                            <p className="text-sm text-slate-500 italic">Semua obat dalam kondisi tanggal kadaluwarsa aman (&gt; 6 bulan).</p>
                                        ) : (
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm text-slate-600">
                                                    <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b">
                                                        <tr>
                                                            <th className="p-3">Nama Obat</th>
                                                            <th className="p-3">Batch</th>
                                                            <th className="p-3">Exp Date</th>
                                                            <th className="p-3">Sisa Hari</th>
                                                            <th className="p-3">Stok</th>
                                                            <th className="p-3">Status FEFO</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y">
                                                        {nearExpiredItems.map(item => (
                                                            <tr key={item.id} className="hover:bg-slate-50">
                                                                <td className="p-3 font-medium text-slate-800">{item.name}</td>
                                                                <td className="p-3 text-xs font-mono">{item.batchNo}</td>
                                                                <td className="p-3 font-semibold text-rose-600">{item.expDate}</td>
                                                                <td className="p-3 font-bold">{item.diffDays} hari</td>
                                                                <td className="p-3">{item.stock} {item.unit}</td>
                                                                <td className="p-3">
                                                                    <span className="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold">
                                                                        ⏳ Priority FEFO
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'prescription' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                                    <h2 className="text-lg font-bold text-slate-800 mb-2">Penebusan Resep Pasien</h2>
                                    <p className="text-sm text-slate-500 mb-6">Input resep dokter medis untuk memotong stok obat secara real-time.</p>
                                    
                                    <form onSubmit={handleOutSubmit} className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">No. Resep *</label>
                                                <input type="text" value={outForm.rxNo} onChange={e => setOutForm({...outForm, rxNo: e.target.value})} placeholder="Contoh: RSP/2026/012" className="w-full border rounded-lg p-2.5 text-sm outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Nama Pasien *</label>
                                                <input type="text" value={outForm.patientName} onChange={e => setOutForm({...outForm, patientName: e.target.value})} placeholder="Contoh: Ny. Suminah" className="w-full border rounded-lg p-2.5 text-sm outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Resep *</label>
                                                <input type="date" value={outForm.rxDate} onChange={e => setOutForm({...outForm, rxDate: e.target.value})} className="w-full border rounded-lg p-2.5 text-sm outline-none" required />
                                            </div>
                                        </div>

                                        <div className="space-y-3 pt-2">
                                            <label className="block text-xs font-semibold text-slate-600">Daftar Sediaan Obat *</label>
                                            {outForm.items.map((row, idx) => (
                                                <div key={idx} className="flex items-center gap-3">
                                                    <select value={row.itemId} onChange={e => {
                                                        const newItems = [...outForm.items];
                                                        newItems[idx].itemId = e.target.value;
                                                        setOutForm({...outForm, items: newItems});
                                                    }} className="flex-1 border rounded-lg p-2 text-sm">
                                                        <option value="">-- Pilih Obat --</option>
                                                        {syncedItems.map(item => (
                                                            <option key={item.id} value={item.id}>{item.name} (Stok: {item.stock} {item.unit})</option>
                                                        ))}
                                                    </select>
                                                    <input type="number" min="1" value={row.qty} onChange={e => {
                                                        const newItems = [...outForm.items];
                                                        newItems[idx].qty = e.target.value;
                                                        setOutForm({...outForm, items: newItems});
                                                    }} placeholder="Qty" className="w-24 border rounded-lg p-2 text-sm" />
                                                    {outForm.items.length > 1 && (
                                                        <button type="button" onClick={() => {
                                                            setOutForm({...outForm, items: outForm.items.filter((_, i) => i !== idx)});
                                                        }} className="text-rose-500 p-2"><i className="fa-solid fa-trash"></i></button>
                                                    )}
                                                </div>
                                            ))}
                                            <button type="button" onClick={() => setOutForm({...outForm, items: [...outForm.items, { itemId: '', qty: '' }]})} className="text-xs text-blue-600 font-semibold hover:underline">
                                                + Tambah Baris Obat
                                            </button>
                                        </div>

                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition">
                                            Proses &amp; Kurangi Stok Resep
                                        </button>
                                    </form>
                                </div>
                            )}

                            {activeTab === 'daily_outgoing' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-6">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Daftar Barang Keluar (Rekapitulasi Pengeluaran)</h2>
                                            <p className="text-sm text-slate-500">Rekapitulasi pengeluaran sediaan obat dan BMHP berdasarkan rentang waktu resep.</p>
                                        </div>
                                        <div className="flex flex-wrap items-center gap-2">
                                            <div className="flex items-center gap-1 text-xs">
                                                <span>Dari:</span>
                                                <input type="date" value={outStartDate} onChange={e => setOutStartDate(e.target.value)} className="border rounded px-2 py-1.5" />
                                            </div>
                                            <div className="flex items-center gap-1 text-xs">
                                                <span>s.d.</span>
                                                <input type="date" value={outEndDate} onChange={e => setOutEndDate(e.target.value)} className="border rounded px-2 py-1.5" />
                                            </div>
                                            <button onClick={handleExportDailyOutgoingExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                                                <i className="fa-solid fa-file-excel"></i> Download Excel
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl">
                                            <div className="text-xs font-semibold text-blue-600 uppercase">Total Resep Diproses</div>
                                            <div className="text-2xl font-bold text-slate-800 mt-1">{dailyOutgoing.totalRxCount} Resep</div>
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                                            <div className="text-xs font-semibold text-emerald-600 uppercase">Total Sediaan Keluar</div>
                                            <div className="text-2xl font-bold text-slate-800 mt-1">{dailyOutgoing.totalQtyOut} Unit</div>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b">
                                                <tr>
                                                    <th className="p-3">Kode</th>
                                                    <th className="p-3">Nama Produk</th>
                                                    <th className="p-3">Total Keluar</th>
                                                    <th className="p-3">Satuan</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {dailyOutgoing.list.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="4" className="p-6 text-center text-slate-400 italic">Tidak ada transaksi barang keluar pada rentang tanggal tersebut.</td>
                                                    </tr>
                                                ) : (
                                                    dailyOutgoing.list.map(row => (
                                                        <tr key={row.id} className="hover:bg-slate-50">
                                                            <td className="p-3 font-mono text-xs">{row.id}</td>
                                                            <td className="p-3 font-medium text-slate-800">{row.name}</td>
                                                            <td className="p-3 font-bold text-blue-600">{row.totalOut}</td>
                                                            <td className="p-3">{row.unit}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'products' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Katalog &amp; Daftar Produk Farmasi</h2>
                                            <p className="text-sm text-slate-500">Pencarian, penyaringan data sediaan obat, unduh template &amp; upload data barang.</p>
                                        </div>
                                        <div className="flex flex-wrap gap-2 w-full sm:w-auto items-center">
                                            <input 
                                                type="text" 
                                                value={productSearch} 
                                                onChange={e => setProductSearch(e.target.value)} 
                                                placeholder="Cari nama obat / kode..." 
                                                className="border rounded-lg px-3 py-2 text-sm w-full sm:w-48 outline-none" 
                                            />
                                            <select 
                                                value={productCategoryFilter} 
                                                onChange={e => setProductCategoryFilter(e.target.value)} 
                                                className="border rounded-lg px-3 py-2 text-sm bg-white"
                                            >
                                                <option value="ALL">Semua Kategori</option>
                                                <option value="Oral">Oral</option>
                                                <option value="Injeksi">Injeksi</option>
                                                <option value="Cold-Chain">Cold-Chain</option>
                                                <option value="BMHP">BMHP</option>
                                            </select>
                                            <button onClick={handleExportProductsExcel} className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2.5 rounded-lg shadow transition flex items-center gap-1.5" title="Download Template CSV">
                                                <i className="fa-solid fa-file-arrow-down"></i> Template
                                            </button>
                                            <label className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2.5 rounded-lg shadow transition flex items-center gap-1.5 cursor-pointer">
                                                <i className="fa-solid fa-file-arrow-up"></i> Upload Template
                                                <input type="file" accept=".csv" onChange={handleImportProductsCSV} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b">
                                                <tr>
                                                    <th className="p-3">Kode</th>
                                                    <th className="p-3">Nama Produk</th>
                                                    <th className="p-3">Kategori</th>
                                                    <th className="p-3">Stok</th>
                                                    <th className="p-3">Batch &amp; Exp</th>
                                                    <th className="p-3">Label Khusus</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {filteredProducts.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="6" className="p-6 text-center text-slate-400 italic">Tidak ada produk yang sesuai dengan kata kunci pencarian.</td>
                                                    </tr>
                                                ) : (
                                                    filteredProducts.map(item => (
                                                        <tr key={item.id} className="hover:bg-slate-50">
                                                            <td className="p-3 font-mono text-xs">{item.id}</td>
                                                            <td className="p-3 font-medium text-slate-800">{item.name}</td>
                                                            <td className="p-3">{item.category}</td>
                                                            <td className="p-3 font-bold text-blue-600">{item.stock} {item.unit}</td>

                                                    <tbody className="divide-y">
                                                        <tr>
                                                            <td className="p-3 text-center font-bold">1</td>
                                                            <td className="p-3 font-medium text-slate-800">Gudang Utama</td>
                                                            <td className="p-3">
                                                                <input type="date" defaultValue={selectedAdjustmentItem.expDate} className="border rounded p-1.5 text-xs w-32" />
                                                            </td>
                                                            <td className="p-3">
                                                                <input type="text" defaultValue={selectedAdjustmentItem.batchNo} className="border rounded p-1.5 text-xs w-28" />
                                                            </td>
                                                            <td className="p-3 font-mono">
                                                                Rp {(selectedAdjustmentItem.price || 1000).toLocaleString()} <span className="text-[10px] text-slate-400">/{selectedAdjustmentItem.unit}</span>
                                                            </td>
                                                            <td className="p-3 font-bold text-slate-700">{selectedAdjustmentItem.stock} {selectedAdjustmentItem.unit}</td>
                                                            <td className="p-3">
                                                                <div className="flex items-center gap-1">
                                                                    <input 
                                                                        type="number" 
                                                                        value={adjustmentPhysicalQty} 
                                                                        onChange={e => setAdjustmentPhysicalQty(e.target.value)}
                                                                        className="border rounded p-1.5 text-xs w-20 font-bold text-blue-600" 
                                                                    />
                                                                    <span className="text-xs text-slate-500">{selectedAdjustmentItem.unit}</span>
                                                                </div>
                                                            </td>
                                                            <td className={`p-3 font-bold ${(Number(adjustmentPhysicalQty) - selectedAdjustmentItem.stock) > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                                {(Number(adjustmentPhysicalQty) - selectedAdjustmentItem.stock) > 0 ? `+${Number(adjustmentPhysicalQty) - selectedAdjustmentItem.stock}` : (Number(adjustmentPhysicalQty) - selectedAdjustmentItem.stock)} {selectedAdjustmentItem.unit}
                                                            </td>
                                                            <td className="p-3">
                                                                <select value={adjustmentReason} onChange={e => setAdjustmentReason(e.target.value)} className="border rounded p-1.5 text-xs w-full bg-white">
                                                                    <option value="">Pilih Penyebab Selisih</option>
                                                                    <option value="Rusak">Barang Rusak / Pecah</option>
                                                                    <option value="Hilang">Selisih Opname / Hilang</option>
                                                                    <option value="Expired">Kadaluwarsa</option>
                                                                    <option value="Lainnya">Lainnya</option>
                                                                </select>
                                                            </td>
                                                            <td className="p-3">
                                                                <input type="text" value={adjustmentNotes} onChange={e => setAdjustmentNotes(e.target.value)} placeholder="Catatan..." className="border rounded p-1.5 text-xs w-full" />
                                                            </td>
                                                            <td className="p-3 text-center">
                                                                <input type="checkbox" defaultChecked className="w-4 h-4 text-blue-600 rounded" />
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div className="flex justify-end pt-4 border-t">
                                                <div className="w-80 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-xs">
                                                    <div className="font-bold text-slate-800 text-sm mb-1 pb-1 border-b">Ringkasan Penyesuaian Stok</div>
                                                    <div className="flex justify-between">
                                                        <span className="text-slate-500">Total Stok Fisik:</span>
                                                        <span className="font-bold text-slate-800">{adjustmentPhysicalQty !== '' ? adjustmentPhysicalQty : selectedAdjustmentItem.stock} {selectedAdjustmentItem.unit}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-slate-500">Jumlah Penyesuaian:</span>
                                                        <span className="font-bold text-blue-600">{(Number(adjustmentPhysicalQty) - selectedAdjustmentItem.stock)} {selectedAdjustmentItem.unit}</span>
                                                    </div>
                                                    <div className="flex justify-between text-sm border-t pt-2">
                                                        <span className="font-bold text-slate-800">Nilai Penyesuaian:</span>
                                                        <span className="font-extrabold text-emerald-600">Rp {Math.abs((Number(adjustmentPhysicalQty) - selectedAdjustmentItem.stock) * selectedAdjustmentItem.price).toLocaleString()}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {['returns'].includes(activeTab) && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 text-center space-y-3">
                                    <div className="text-4xl text-blue-500"><i className="fa-solid fa-rotate-left"></i></div>
                                    <h2 className="text-base font-bold text-slate-800 capitalize">Modul Retur Pembelian</h2>
                                    <p className="text-xs text-slate-500 max-w-md mx-auto">Modul retur pengadaan berbasis faktur pembelian PBF/Diskes.</p>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
