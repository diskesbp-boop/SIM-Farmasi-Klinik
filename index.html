        // Menggabungkan dan mengakumulasi stok untuk kode barang yang sama
        const processItems = (rawList) => {
            const map = {};
            rawList.forEach(item => {
                if (map[item.id]) {
                    map[item.id].initialStock += Number(item.initialStock) || 0;
                    if (!map[item.id].batchNo.includes(item.batchNo)) {
                        map[item.id].batchNo += `, ${item.batchNo}`;
                    }
                } else {
                    map[item.id] = { ...item };
                }
            });
            return Object.values(map);
        };

        const INITIAL_ITEMS = processItems(RAW_ITEMS);

        const INITIAL_TRANSACTIONS = [
            { id: 'TRX-1001', date: '2026-11-11', itemId: 'MMPB0100', itemName: 'Acepres 12.5 mg (Captopril)', type: 'IN', qty: 300, docNo: 'DO/KODAERAL/2026/11', notes: 'Dropping Logistik' },

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('sim_farmasi_kodaeral_items');
                return saved ? JSON.parse(saved) : INITIAL_ITEMS;
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('sim_farmasi_kodaeral_trxs');
                return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
            });

            const [alertMessage, setAlertMessage] = useState('');
            const [alertType, setAlertType] = useState('success');

            const [productSearch, setProductSearch] = useState('');
            
            // State Form Barang Masuk (IN)
            const [inForm, setInForm] = useState({
                docNo: '',
                supplier: '',
                date: new Date().toISOString().split('T')[0],
                itemId: '',
                qty: ''
            });

            // State Form Resep Keluar (OUT)
            const [outForm, setOutForm] = useState({
                patientName: '',
                rxNo: '',
                rxDate: new Date().toISOString().split('T')[0],
                items: [{ itemId: '', qty: '' }]
            });

            useEffect(() => {
                localStorage.setItem('sim_farmasi_kodaeral_items', JSON.stringify(items));
            }, [items]);

            useEffect(() => {
                localStorage.setItem('sim_farmasi_kodaeral_trxs', JSON.stringify(transactions));
            }, [transactions]);

            const showAlert = (msg, type = 'success') => {
                setAlertMessage(msg);
                setAlertType(type);
                setTimeout(() => setAlertMessage(''), 4000);
            };

            const calculateCurrentStock = (itemId) => {
                const targetItem = items.find(i => i.id === itemId);
                if (!targetItem) return 0;
                let stock = Number(targetItem.initialStock) || 0;

                transactions.forEach(t => {
                    if (t.itemId === itemId) {
                        const qty = Number(t.qty) || 0;
                        if (t.type === 'IN') stock += qty;
                        else if (t.type === 'OUT') stock -= qty;
                        else if (t.type === 'ADJUSTMENT') stock += qty;
                    }
                });
                return stock < 0 ? 0 : stock;
            };

            const syncedItems = items.map(item => ({
                ...item,
                stock: calculateCurrentStock(item.id)
            }));

            const handleInSubmit = (e) => {
                e.preventDefault();
                if (!inForm.docNo || !inForm.supplier || !inForm.itemId || !inForm.qty) {
                    showAlert('Mohon lengkapi seluruh field Barang Masuk!', 'error');
                    return;
                }
                const target = syncedItems.find(i => i.id === inForm.itemId);
                const newTrx = {
                    id: 'TRX-IN-' + Date.now(),
                    date: inForm.date,
                    itemId: inForm.itemId,
                    itemName: target ? target.name : '',
                    type: 'IN',
                    qty: parseInt(inForm.qty, 10),
                    docNo: inForm.docNo,
                    notes: `Sumber: ${inForm.supplier}`
                };

                setTransactions([newTrx, ...transactions]);
                setInForm({ docNo: '', supplier: '', date: new Date().toISOString().split('T')[0], itemId: '', qty: '' });
                showAlert(`Barang masuk dengan No. SJ ${newTrx.docNo} berhasil dicatat &amp; stok bertambah!`);
            };

            const handleOutSubmit = (e) => {
                e.preventDefault();
                if (!outForm.rxNo || !outForm.patientName) {
                    showAlert('Mohon isi Nomor Resep dan Nama Pasien!', 'error');
                    return;
                }
                const validRows = outForm.items.filter(i => i.itemId && Number(i.qty) > 0);
                if (validRows.length === 0) {
                    showAlert('Pilih minimal 1 obat dengan kuantitas valid!', 'error');
                    return;
                }

                let newTrxs = [];
                validRows.forEach(row => {
                    const target = syncedItems.find(i => i.id === row.itemId);
                    newTrxs.push({
                        id: 'TRX-OUT-' + Date.now() + '-' + Math.floor(Math.random()*10),
                        date: outForm.rxDate,
                        itemId: row.itemId,
                        itemName: target ? target.name : '',
                        type: 'OUT',
                        qty: parseInt(row.qty, 10),
                        docNo: outForm.rxNo,
                        notes: `Pasien: ${outForm.patientName}`
                    });
                });

                setTransactions([...newTrxs, ...transactions]);
                setOutForm({ patientName: '', rxNo: '', rxDate: new Date().toISOString().split('T')[0], items: [{ itemId: '', qty: '' }] });
                showAlert(`Resep ${outForm.rxNo} berhasil diproses! Stok terpotong otomatis.`);
            };

            const handleCancelTransaction = (docNo) => {
                if (confirm(`Batalkan transaksi dengan No. Dokumen ${docNo} dan kembalikan stok?`)) {
                    setTransactions(transactions.filter(t => t.docNo !== docNo));
                    showAlert(`Transaksi ${docNo} dibatalkan dan stok dikembalikan.`);
                }
            };

            const [stockCardItemId, setStockCardItemId] = useState(syncedItems[0]?.id || '');

            const getStockCardTransactions = () => {
                if (!stockCardItemId) return [];
                const itemTrxs = transactions.filter(t => t.itemId === stockCardItemId);
                itemTrxs.sort((a, b) => new Date(a.date) - new Date(b.date));
                const targetItem = items.find(i => i.id === stockCardItemId);
                let runningStock = targetItem ? (Number(targetItem.initialStock) || 0) : 0;

                return itemTrxs.map(t => {
                    if (t.type === 'IN') runningStock += t.qty;
                    else if (t.type === 'OUT') runningStock -= t.qty;
                    else if (t.type === 'ADJUSTMENT') runningStock += t.qty;
                    return { ...t, balance: runningStock };
                });
            };

            const filteredProducts = syncedItems.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(productSearch.toLowerCase()) || item.id.toLowerCase().includes(productSearch.toLowerCase());
                return matchesSearch;
            });

            const totalInQty = transactions.filter(t => t.type === 'IN').reduce((acc, t) => acc + Number(t.qty), 0);
            const totalOutQty = transactions.filter(t => t.type === 'OUT').reduce((acc, t) => acc + Number(t.qty), 0);

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 font-sans text-slate-800">
                    <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg">
                                    <i className="fa-solid fa-house-medical text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide flex items-center gap-2">
                                        SIM-FARMASI KLINIK PRATAMA KODAERAL XIV
                                        <span className="text-[10px] bg-blue-800 text-blue-200 px-2 py-0.5 rounded-full uppercase">Synced Spreadsheet</span>
                                    </h1>
                                    <p className="text-xs text-slate-400">Terhubung dengan Master Data Stok Barang (Diskes Kodaeral XIV)</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col lg:flex-row gap-6">
                        <aside className="w-full lg:w-64 flex-shrink-0 space-y-1 bg-white p-3 rounded-xl border border-slate-200 shadow-sm self-start">
                            <div className="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Navigasi Utama</div>
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 transition ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fa-solid fa-chart-pie w-4 text-center"></i> Ringkasan Dashboard &amp; KPI
                            </button>
                            <button onClick={() => setActiveTab('products')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 transition ${activeTab === 'products' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fa-solid fa-pills w-4 text-center"></i> Stok Sediaan Obat
                            </button>
                            <button onClick={() => setActiveTab('goods_in')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 transition ${activeTab === 'goods_in' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fa-solid fa-truck-ramp-box w-4 text-center"></i> Input Barang Masuk (IN)
                            </button>
                            <button onClick={() => setActiveTab('prescription')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 transition ${activeTab === 'prescription' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fa-solid fa-file-prescription w-4 text-center"></i> Penebusan Resep (Keluar)
                            </button>
                            <button onClick={() => setActiveTab('daily_outgoing')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 transition ${activeTab === 'daily_outgoing' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fa-solid fa-boxes-stacked w-4 text-center"></i> Daftar Barang Keluar
                            </button>
                            <button onClick={() => setActiveTab('stockcard')} className={`w-full text-left px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2.5 transition ${activeTab === 'stockcard' ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fa-solid fa-id-card-clip w-4 text-center"></i> Kartu Stok (Audit Trail)
                            </button>
                        </aside>

                        <main className="flex-1 min-w-0 space-y-6">
                            {alertMessage && (
                                <div className={`p-4 rounded-xl border flex items-center justify-between shadow-sm transition ${alertType === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`}>
                                    <div className="flex items-center gap-2.5">
                                        <i className={`fa-solid ${alertType === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                                        <span className="text-sm font-medium">{alertMessage}</span>
                                    </div>
                                    <button onClick={() => setAlertMessage('')} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                            )}

                            {activeTab === 'dashboard' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-boxes-stacked"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">Total Jenis Sediaan</div>
                                                <div className="text-xl font-bold text-slate-800">{syncedItems.length} Item</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-cubes"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">Total Stok Fisik</div>
                                                <div className="text-xl font-bold text-slate-800">{syncedItems.reduce((acc, item) => acc + item.stock, 0)} Unit</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-truck-ramp-box"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">KPI Total Barang Masuk</div>
                                                <div className="text-xl font-bold text-indigo-600">+{totalInQty} Unit</div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                            <div className="w-12 h-12 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-xl font-bold"><i className="fa-solid fa-notes-medical"></i></div>
                                            <div>
                                                <div className="text-xs font-medium text-slate-500">KPI Total Barang Keluar</div>
                                                <div className="text-xl font-bold text-rose-600">-{totalOutQty} Unit</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'products' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Daftar Sediaan (Akumulasi Stok Per Kode Barang)</h2>
                                            <p className="text-sm text-slate-500">Pencarian dan monitoring stok real-time.</p>
                                        </div>
                                        <div className="flex gap-2 w-full sm:w-auto">
                                            <input type="text" value={productSearch} onChange={e => setProductSearch(e.target.value)} placeholder="Cari obat..." className="border rounded-lg px-3 py-2 text-sm w-full sm:w-60 outline-none" />
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b sticky top-0">
                                                <tr>
                                                    <th className="p-3">Kode Barang</th>
                                                    <th className="p-3">Nama Sediaan</th>
                                                    <th className="p-3">Kategori</th>
                                                    <th className="p-3">Total Stok Terkini</th>
                                                    <th className="p-3">Batch &amp; Exp</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {filteredProducts.map(item => (
                                                    <tr key={item.id} className="hover:bg-slate-50">
                                                        <td className="p-3 font-mono text-xs font-semibold text-slate-700">{item.id}</td>
                                                        <td className="p-3 font-medium text-slate-800">{item.name}</td>
                                                        <td className="p-3">{item.category}</td>
                                                        <td className="p-3 font-bold text-blue-600">{item.stock} {item.unit}</td>
                                                        <td className="p-3 text-xs">
                                                            <div>Batch: <span className="font-mono">{item.batchNo}</span></div>
                                                            <div className="text-rose-600 font-semibold">Exp: {item.expDate}</div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'goods_in' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-6">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800 mb-1">Pencatatan &amp; KPI Barang Masuk (Dropping / Pembelian)</h2>
                                        <p className="text-sm text-slate-500">Catat kiriman dari distributor/gudang untuk otomatis menambah stok fisik.</p>
                                    </div>

                                    <form onSubmit={handleInSubmit} className="space-y-4 bg-slate-50 p-4 rounded-xl border">
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">No. Surat Jalan / DO *</label>
                                                <input type="text" value={inForm.docNo} onChange={e => setInForm({...inForm, docNo: e.target.value})} placeholder="Contoh: DO/2026/001" className="w-full border rounded-lg p-2.5 text-sm bg-white outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Sumber / Distributor *</label>
                                                <input type="text" value={inForm.supplier} onChange={e => setInForm({...inForm, supplier: e.target.value})} placeholder="Contoh: KFTD / AAM" className="w-full border rounded-lg p-2.5 text-sm bg-white outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Terima *</label>
                                                <input type="date" value={inForm.date} onChange={e => setInForm({...inForm, date: e.target.value})} className="w-full border rounded-lg p-2.5 text-sm bg-white outline-none" required />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Pilih Sediaan Obat *</label>
                                                <select value={inForm.itemId} onChange={e => setInForm({...inForm, itemId: e.target.value})} className="w-full border rounded-lg p-2.5 text-sm bg-white outline-none" required>
                                                    <option value="">-- Pilih Sediaan --</option>
                                                    {syncedItems.map(i => (
                                                        <option key={i.id} value={i.id}>{i.name} ({i.id})</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Jumlah Masuk (Qty) *</label>
                                                <input type="number" min="1" value={inForm.qty} onChange={e => setInForm({...inForm, qty: e.target.value})} placeholder="Jumlah" className="w-full border rounded-lg p-2.5 text-sm bg-white outline-none" required />
                                            </div>
                                            <div className="flex items-end">
                                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition">
                                                    <i className="fa-solid fa-plus"></i> Simpan &amp; Tambah Stok
                                                </button>
                                            </div>
                                        </div>
                                    </form>

                                    <div className="overflow-x-auto">
                                        <h3 className="font-bold text-slate-700 text-sm mb-3">Riwayat Barang Masuk</h3>
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b">
                                                <tr>
                                                    <th className="p-3">Tanggal</th>
                                                    <th className="p-3">No. Surat Jalan</th>
                                                    <th className="p-3">Sumber / Distributor</th>
                                                    <th className="p-3">Nama Sediaan</th>
                                                    <th className="p-3 text-right">Qty Masuk (+)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {transactions.filter(t => t.type === 'IN').length === 0 ? (
                                                    <tr><td colSpan="5" className="p-6 text-center text-slate-400 italic">Belum ada riwayat barang masuk.</td></tr>
                                                ) : (
                                                    transactions.filter(t => t.type === 'IN').map((t, idx) => (
                                                        <tr key={t.id || idx} className="hover:bg-slate-50">
                                                            <td className="p-3">{t.date}</td>
                                                            <td className="p-3 font-mono text-xs font-semibold text-emerald-600">{t.docNo}</td>
                                                            <td className="p-3 text-xs">{t.notes}</td>
                                                            <td className="p-3 font-medium text-slate-800">{t.itemName}</td>
                                                            <td className="p-3 text-right font-bold text-emerald-600">+{t.qty}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'prescription' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                                    <h2 className="text-lg font-bold text-slate-800 mb-2">Penebusan Resep (Barang Keluar)</h2>
                                    <p className="text-sm text-slate-500 mb-6">Input resep untuk mengurangi stok secara real-time.</p>
                                    
                                    <form onSubmit={handleOutSubmit} className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">No. Resep *</label>
                                                <input type="text" value={outForm.rxNo} onChange={e => setOutForm({...outForm, rxNo: e.target.value})} placeholder="Contoh: RSP/2026/010" className="w-full border rounded-lg p-2.5 text-sm outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Nama Pasien *</label>
                                                <input type="text" value={outForm.patientName} onChange={e => setOutForm({...outForm, patientName: e.target.value})} placeholder="Contoh: Koptu Joko" className="w-full border rounded-lg p-2.5 text-sm outline-none" required />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Resep *</label>
                                                <input type="date" value={outForm.rxDate} onChange={e => setOutForm({...outForm, rxDate: e.target.value})} className="w-full border rounded-lg p-2.5 text-sm outline-none" required />
                                            </div>
                                        </div>

                                        <div className="space-y-3 pt-2">
                                            <label className="block text-xs font-semibold text-slate-600">Daftar Sediaan Obat *</label>
                                            {outForm.items.map((row, idx) => (
                                                <div key={idx} className="flex items-center gap-3">
                                                    <select value={row.itemId} onChange={e => {
                                                        const newItems = [...outForm.items];
                                                        newItems[idx].itemId = e.target.value;
                                                        setOutForm({...outForm, items: newItems});
                                                    }} className="flex-1 border rounded-lg p-2 text-sm">
                                                        <option value="">-- Pilih Obat --</option>
                                                        {syncedItems.map(item => (
                                                            <option key={item.id} value={item.id}>{item.name} (Stok: {item.stock} {item.unit})</option>
                                                        ))}
                                                    </select>
                                                    <input type="number" min="1" value={row.qty} onChange={e => {
                                                        const newItems = [...outForm.items];
                                                        newItems[idx].qty = e.target.value;
                                                        setOutForm({...outForm, items: newItems});
                                                    }} placeholder="Qty" className="w-24 border rounded-lg p-2 text-sm" />
                                                </div>
                                            ))}
                                        </div>

                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition">
                                            Proses Resep &amp; Potong Stok
                                        </button>
                                    </form>
                                </div>
                            )}

                            {activeTab === 'daily_outgoing' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-6">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Daftar Barang Keluar &amp; Pembatalan Transaksi</h2>
                                            <p className="text-sm text-slate-500">Riwayat pengeluaran obat lengkap dengan tombol pembatalan untuk pengembalian stok.</p>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b">
                                                <tr>
                                                    <th className="p-3">Tanggal</th>
                                                    <th className="p-3">No. Resep</th>
                                                    <th className="p-3">Keterangan Pasien</th>
                                                    <th className="p-3">Nama Sediaan</th>
                                                    <th className="p-3">Qty Keluar</th>
                                                    <th className="p-3 text-center">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {transactions.filter(t => t.type === 'OUT').length === 0 ? (
                                                    <tr><td colSpan="6" className="p-6 text-center text-slate-400 italic">Belum ada transaksi barang keluar.</td></tr>
                                                ) : (
                                                    transactions.filter(t => t.type === 'OUT').map((t, idx) => (
                                                        <tr key={t.id || idx} className="hover:bg-slate-50">
                                                            <td className="p-3">{t.date}</td>
                                                            <td className="p-3 font-mono text-xs font-semibold text-blue-600">{t.docNo}</td>
                                                            <td className="p-3 text-xs">{t.notes}</td>
                                                            <td className="p-3 font-medium text-slate-800">{t.itemName}</td>
                                                            <td className="p-3 font-bold text-rose-600">{t.qty}</td>
                                                            <td className="p-3 text-center">
                                                                <button onClick={() => handleCancelTransaction(t.docNo)} className="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs px-3 py-1.5 rounded-lg font-semibold transition">
                                                                    <i className="fa-solid fa-ban"></i> Batalkan
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'stockcard' && (
                                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-slate-800">Kartu Stok Barang (Audit Trail)</h2>
                                            <p className="text-sm text-slate-500">Mutasi masuk dan keluar per item sediaan.</p>
                                        </div>
                                        <div className="w-full sm:w-64">
                                            <select value={stockCardItemId} onChange={e => setStockCardItemId(e.target.value)} className="w-full border rounded-lg p-2 text-sm">
                                                {syncedItems.map(i => (
                                                    <option key={i.id} value={i.id}>{i.name} ({i.id})</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-xs font-semibold uppercase text-slate-500 border-b">
                                                <tr>
                                                    <th className="p-3">Tanggal</th>
                                                    <th className="p-3">No. Dokumen</th>
                                                    <th className="p-3">Mutasi</th>
                                                    <th className="p-3 text-right">Masuk (+)</th>
                                                    <th className="p-3 text-right">Keluar (-)</th>
                                                    <th className="p-3 text-right">Saldo Stok</th>
                                                    <th className="p-3">Keterangan</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {getStockCardTransactions().map((t, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="p-3">{t.date}</td>
                                                        <td className="p-3 font-mono text-xs">{t.docNo}</td>
                                                        <td className="p-3 font-semibold text-xs">{t.type}</td>
                                                        <td className="p-3 text-right text-emerald-600 font-bold">{t.type === 'IN' ? `+${t.qty}` : '-'}</td>
                                                        <td className="p-3 text-right text-rose-600 font-bold">{t.type === 'OUT' ? `-${t.qty}` : '-'}</td>
                                                        <td className="p-3 text-right font-bold text-slate-800">{t.balance}</td>
                                                        <td className="p-3 text-xs">{t.notes}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
